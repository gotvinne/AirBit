name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  micro-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        controller: [flight, hand]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt install -y gcc python3 cmake gcc-arm-none-eabi binutils-arm-none-eabi

      - name: microinstall
        run: |
          chmod +x microinstall.sh
          ./microinstall.sh
      - name: Copy src folder to sdk
        run: rsync -a --delete ./src/ ./microbit-v2-sdk/source/

      - name: Configure controller
        run: |
          python3 configure_controller.py \
            --controller "${{ matrix.controller }}" \
            --codalpath microbit-v2-sdk/codal.json
      - name: microbuild python
        working-directory: microbit-v2-sdk
        run: python3 build.py
        
      - name: Name firmware
        run: |
          cp microbit-v2-sdk/MICROBIT.hex \
            "AIRBIT-${{ matrix.controller }}-${{ github.ref_name }}.hex"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRBIT-${{ matrix.controller }}-${{ github.ref_name }}
          path: AIRBIT-${{ matrix.controller }}-${{ github.ref_name }}.hex
          if-no-files-found: error

  release:
    needs: micro-build
    runs-on: ubuntu-latest

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AIRBIT-*-${{ github.ref_name }}
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.hex
          fail_on_unmatched_files: true